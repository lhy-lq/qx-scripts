# ============================================================
# 建行生活每日签到 · Quantumult X 配置片段
# 脚本：scripts/ccb-life-checkin.js（抓包 + 签到同一个文件）
# ============================================================
#
# 用法：把下面三段分别追加到你 QX 配置文件里对应区块，
#       不是整个文件覆盖你的配置。
#
# QX 注释符支持 ; # // 三种（sample.conf:3）。注意官方
# [rewrite_local] 的 20 行示例全部以 ; 开头（sample.conf:303-322），
# 抄的时候忘记删分号是最高频的「复制即失效」原因。
#
# ============================================================


# ------------------------------------------------------------
# 0. 抓不到包的时候先用这个（诊断）
# ------------------------------------------------------------
#
# ccb-dump-all.js 什么都抓，不挑路径不挑 body，还会对比同一个接口
# 两次请求的 sign 是否变化。用它是为了回答两个问题：
#   1. MitM 到底通不通
#   2. 签名是不是每次都变（决定「快照重放」这条路走不走得通）
#
# 抓到东西之后，把它从配置里删掉，换回下面第 1 段。

[rewrite_local]
^https?:\/\/.+\.ccb\.com(\.cn)?\/ url script-request-body https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-dump-all.js

[task_local]
event-interaction https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-dump-all.js, tag=建行dump, enabled=true

[mitm]
hostname = %APPEND% *.ccb.com, *.ccb.com.cn


# ------------------------------------------------------------
# 1. rewrite：抓包（正式用这个）
# ------------------------------------------------------------
#
# 作用：你打开建行生活 App 时，这条规则会拦到 txCtrl 请求，
#       脚本把「已签好名」的那条请求存进 $prefs，然后原样放行。
#
# 每抓到一次会弹一条通知。抓够了你就可以把这一行注释掉，
# 否则每次打开 App 都弹一条，很烦。
#
# URL 里的斜杠要写成 \/（QX 用正则匹配 URL）。

[rewrite_local]
^https?:\/\/yunbusiness\.ccb\.com\/ url script-request-body https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-life-checkin.js


# ------------------------------------------------------------
# 2. mitm：必须开，且证书要装 + 信任
# ------------------------------------------------------------
#
# 匹配的是 TLS SNI 或目标 IP，不是 HTTP Host 头（sample.conf:395-400）。
# 所以这里只能写域名，不能写路径。
#
# 证书安装：QX → 设置 → MitM → 生成证书 → 安装证书
#           → 系统设置 → 通用 → VPN与设备管理 → 装描述文件
#           → 系统设置 → 通用 → 关于本机 → 证书信任设置 → 打开开关
# 少任何一步，HTTPS 请求都拦不到，脚本表现为「完全没反应」。

[mitm]
hostname = %APPEND% yunbusiness.ccb.com


# ------------------------------------------------------------
# 3. task_local：每天定时重放
# ------------------------------------------------------------
#
# 5 段 cron：分 时 日 月 周。下面这条是每天 07:17。
#
# 想改时间就改前两个数。别写 6 段 —— QX 官方只说「支持 5 或 6 段」
# （sample.conf:335），但 6 段每段是什么语义官方没写明，是已知待实测项。
#
# toggle-proxy：如果签到接口需要国内直连，加上 toggle-proxy=direct；
#               走代理能通就去掉。

[task_local]
17 7 * * * https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-life-checkin.js, tag=建行生活, enabled=true

# 手动测试用这一条（事件触发，不用等到点）：
# event-interaction https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-life-checkin.js, tag=建行生活测试, enabled=true
#
# 触发：QX 首页 → 风车图标 → 事件 → 建行生活测试
# 注意：event-* 类型任务只在 QX 隧道运行时才可能触发（sample.conf:336），
#       所以跑之前确认开关是开的。


# ------------------------------------------------------------
# 关于镜像地址
# ------------------------------------------------------------
#
# GitHub raw（raw.githubusercontent.com）在国内经常连不上，QX 直接拉会失败。
# 上面用的是 jsDelivr 的 gcore 节点（实测 200）。
#
# 备选，按顺序试：
#   https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-life-checkin.js
#   https://cdn.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-life-checkin.js
#   https://fastly.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-life-checkin.js
#   https://ghproxy.net/https://raw.githubusercontent.com/lhy-lq/qx-scripts/main/scripts/ccb-life-checkin.js
#
# 注意 jsDelivr 有缓存：你改了仓库之后，@main 可能要等几分钟才更新。
# 想立刻生效，把 @main 换成具体 commit 的短 hash。


# ------------------------------------------------------------
# 多账号
# ------------------------------------------------------------
#
# 一个账号抓一次包，脚本按 body 内容区分账号，最多存 5 个（MAX_ACCOUNTS）。
# 所以多账号不需要多份配置，也不需要多行 task_local ——
# 用几个账号各自在 App 里点一次签到即可，定时任务会自动全部重放。
#
# 前提：这些账号的请求 body 不一样（mebId 不同）。如果 body 完全一样，
# 脚本会把它们视为同一个账号并覆盖。


# ------------------------------------------------------------
# 排错顺序
# ------------------------------------------------------------
#
# 1. 打开 App 手动签到，有没有收到「🎉 捕获成功」？
#    没有 → MitM 没生效。查证书信任开关、查 [mitm] 域名拼写。
#
# 2. 收到了，手动跑定时任务，有没有收到「✅ 签到成功」？
#    收到「⚠️ 没有数据」→ $prefs 里没存上。看日志有没有 [CCB] 开头的内容。
#    收到「❌ 会话失效」→ 快照过期了，回 App 里再点一次签到重新抓。
#    收到「❌ 服务端错误」→ 建行那边的问题，不是你配错了，明天再看。
#    收到「❌ 非 JSON」→ 大概率被 WAF 拦了，或域名写错打到了别的服务。
#
# 3. 什么通知都没有？→ 脚本根本没加载。
#    可能是镜像拉不到（换成 ghproxy.net 试）、
#    或者 task_local 那行前面还留着 ; 或 #。
#
# 日志位置：QX → 日志。脚本所有输出都以 [CCB] 开头。
