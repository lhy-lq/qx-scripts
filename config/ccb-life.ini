# ============================================================
# 建行生活签到 · Quantumult X 配置片段
#
# 【这不是让整个文件覆盖你的配置】
# 是把下面需要的几行，抄进你 QX 配置文件里对应的区块。
#
# 初学者最容易错的三条：
#   1. 每个 [区块名] 在一个配置文件里只能出现一次。
#      你已经有 [mitm] 的话，把 hostname 追加进去，
#      别再写第二个 [mitm] —— QX 只会认其中一个。
#   2. 行首的 ; # // 都是注释符。官方示例全是 ; 开头的，
#      照抄忘了删分号 = 规则不生效，这是最高频的坑。
#   3. URL 走正则，斜杠写成 \/
#
# 现在处于「第 1 步：诊断抓包」。通了之后换「第 2 步」。
# ============================================================


# ============================================================
# 第 1 步 · 现在用这一段
# ============================================================
#
# ccb-dump-all.js 什么都抓，不挑路径不挑 body，还会对比同一个
# 接口两次请求的 sign 变不变。它回答两个你现在没法判断的问题：
#   1. MitM 到底通不通（抓到东西就通）
#   2. 签到走的是哪个 txcode、签名是不是每次都变

[rewrite_local]
^https?:\/\/(.+\.)?ccb\.com(\.cn)?\/ url script-request-body https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-dump-all.js

[task_local]
event-interaction https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-dump-all.js, tag=建行dump, enabled=true

[mitm]
hostname = *.ccb.com, ccb.com, *.ccb.com.cn, ccb.com.cn


# ============================================================
# 第 2 步 · 诊断通了之后才用这一段
# ============================================================
#
# 做法：把上面第 1 步的三段整段删掉，再把下面这些行前面的 #
# 去掉，粘上去。
#
# 差别：抓包规则从 ccb-dump-all.js 换成 ccb-life-checkin.js，
#       定时任务从「事件触发」换成「每天 07:17 自动跑」。
#
# #[rewrite_local]
# ^https?:\/\/(.+\.)?ccb\.com(\.cn)?\/ url script-request-body https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-life-checkin.js
#
# [task_local]
# 17 7 * * * https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-life-checkin.js, tag=建行生活, enabled=true
#
# 5 段 cron = 分 时 日 月 周。上面这条是每天 07:17。
# 别写 6 段：QX 官方只说「支持 5 或 6 段」（sample.conf:335），
# 6 段每段是什么语义官方没写明，属于已知待实测项。


# ============================================================
# MitM 证书：四步，一步都不能少
# ============================================================
#
# 少任何一步，HTTPS 请求都拦不到，表现就是「脚本完全没反应」。
#
#   ① QX 里生成证书
#   ② QX 里点「安装证书」，跳到系统设置装描述文件
#   ③ 系统设置 → 通用 → VPN与设备管理 → 找到 Quantumult X
#      的描述文件 → 点它 → 安装
#   ④ 系统设置 → 通用 → 关于本机 → 拉到底 → 证书信任设置
#      → 把 Quantumult X 的开关打开
#
# 第 ④ 步是绝大多数人漏掉的一步。只装不信任，证书等于没装。
#
# [mitm] 匹配的是 TLS SNI 或目标 IP，不是 HTTP Host 头
# （官方原文 sample.conf:365：Only the TLS SNI or destination
#   address in "hostname" will be handled by MitM.）
# 所以这里只能写域名，写不了路径。* 和 ? 通配符有效。


# ============================================================
# 脚本地址：为什么用 gcore.jsdelivr.net
# ============================================================
#
# GitHub raw（raw.githubusercontent.com）国内经常连不上，
# QX 直接拉会失败。gcore 节点实测可通。
#
# 备选，按顺序试：
#   https://gcore.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-dump-all.js
#   https://ghproxy.net/https://raw.githubusercontent.com/lhy-lq/qx-scripts/main/scripts/ccb-dump-all.js
#   https://fastly.jsdelivr.net/gh/lhy-lq/qx-scripts@main/scripts/ccb-dump-all.js
#
# 不要用 cdn.jsdelivr.net —— 它 301 跳到被墙的 raw.githubusercontent.com。
#
# jsDelivr 有 CDN 缓存：@main 在 push 之后可能要几分钟才更新。
# 想立刻生效，把 @main 换成具体 commit 短 hash。
#
# 如果 remote 地址在 QX 里就是不工作，把脚本下载下来存到
# 「文件 App → 我的 iPhone → Quantumult X → Scripts」，
# 然后把上面 URL 换成纯文件名 ccb-dump-all.js。
# 官方文档口径就是本地文件（sample.conf:298）。


# ============================================================
# 多账号（等你先跑通单账号再看这段）
# ============================================================
#
# 一个账号在 App 里点一次签到 = 抓一份快照，脚本按 body 内容
# 区分账号，最多存 5 个（MAX_ACCOUNTS）。
#
# 所以多账号不需要多份配置、不需要多行 task_local ——
# 几个账号各自在 App 里签一次，定时任务会自动全部重放。
#
# 前提：这些账号的请求 body 不一样（mebId 不同）。
# body 完全一样会被当成同一个账号并覆盖。
